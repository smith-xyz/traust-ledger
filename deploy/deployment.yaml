apiVersion: apps/v1
kind: Deployment
metadata:
  name: laas
  labels:
    app.kubernetes.io/name: laas
    app.kubernetes.io/component: ledger-service
spec:
  # Single-writer design: exactly one replica holds the write lock.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: laas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: laas
        app.kubernetes.io/component: ledger-service
    spec:
      serviceAccountName: laas
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: laas
          image: laas:latest
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: laas-config
            - secretRef:
                name: laas-secrets
                optional: true
          volumeMounts:
            - name: signing-key
              mountPath: /var/run/secrets/laas/signing-key
              readOnly: true
            - name: data
              mountPath: /var/lib/laas/data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            # healthz is a trivial async handler, but it queues behind the
            # event loop when a burst of layer work is in flight — the 1s
            # default killed the container ~hourly under the listing fan-out
            # before routes moved off the loop (2026-10-13 incident).
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: signing-key
          secret:
            secretName: laas-signing-key
            optional: true
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
