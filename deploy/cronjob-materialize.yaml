apiVersion: batch/v1
kind: CronJob
metadata:
  name: laas-materialize
spec:
  # Keeps the queryable findings projection (traust_ledger.materialized_findings)
  # in step with the event log. The projection is a cache, never a source of
  # truth: the fold is recomputed from events on every run, per-layer commits
  # make partial failures harmless, and re-runs are idempotent.
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: laas
          containers:
            - name: materialize
              image: laas:latest
              command: ["python", "-m", "traust_ledger.cli", "materialize", "--prune-empty"]
              env:
                # The projection lives in the ledger's own database — the
                # schema gate requires the traust storage registry there.
                # DB-backed deployments get this for free from laas-secrets;
                # file-backed ones must point LAAS_MATERIALIZE_URL at an
                # already-initialized target.
                - name: LAAS_MATERIALIZE_URL
                  valueFrom:
                    secretKeyRef:
                      name: laas-secrets
                      key: LAAS_DATABASE_URL
                      optional: true
              envFrom:
                - configMapRef:
                    name: laas-config
                - secretRef:
                    name: laas-secrets
                    optional: true
              volumeMounts:
                - name: data
                  mountPath: /var/lib/laas/data
                  readOnly: true
          restartPolicy: OnFailure
          volumes:
            - name: data
              emptyDir: {}
              # PLACEHOLDER: production overlay MUST bind the real data volume
              # (PVC/NFS) — same caveat as laas-verify.
